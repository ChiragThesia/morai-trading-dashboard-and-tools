# The gate. Every job runs the exact command tools/gate.sh runs for that tool, so CI and
# local cannot drift apart (D-05, D-06, OPS-01). The four job names below are referenced
# verbatim by plan 01-10's branch ruleset -- a rename here silently deadlocks every future
# pull request (GitHub waits forever for a required check that never reports).
#
# `push` (no branch filter) so a throwaway branch's run is observable without a PR --
# Task 2 of 01-02-PLAN.md pushes a deliberate violation straight to a branch and reads its
# run. `pull_request` is restricted to `main`, which is the only merge path this repo has.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-basedpyright:
    name: typecheck-basedpyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - run: uv run basedpyright

  typecheck-mypy:
    name: typecheck-mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - run: uv run mypy src tests

  lint-ruff:
    name: lint-ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  test-pytest:
    name: test-pytest
    runs-on: ubuntu-latest
    # postgres:18-alpine -- same major docker-compose.yml pins, which is the major the live
    # Railway Postgres runs (ghcr.io/railwayapp-templates/postgres-ssl:18). This container is
    # the only place a @pytest.mark.db test can run at all: Docker's local daemon is broken
    # and Railway's Postgres is private-network-only (D-17).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: morai
          POSTGRES_PASSWORD: morai
          POSTGRES_DB: morai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Local-only, CI-only credential matching docker-compose.yml -- not a real secret.
      DATABASE_URL: postgresql://morai:morai@localhost:5432/morai
      # Local-only, CI-only credential for the least-privilege `morai_app` role
      # migration 0003 creates -- not a real secret. Short and letters-only so
      # test_no_tracked_file_carries_a_real_looking_postgres_password keeps
      # passing by shape, not by exception.
      MORAI_APP_DB_PASSWORD: moraiapp
      # Local-only, CI-only KEK for the envelope encryption migration 0007 introduces
      # -- not a real secret. Base64 of exactly 32 bytes, as `settings.master_key_bytes`
      # requires for AES-256-GCM. It decodes to the ASCII string
      # "morai-local-dev-key-not-a-secret", so anyone who decodes it reads what it is.
      # The production KEK lives only in Railway's environment (D3-06) and is never
      # tracked here.
      MORAI_MASTER_KEY: bW9yYWktbG9jYWwtZGV2LWtleS1ub3QtYS1zZWNyZXQ=
    steps:
      - uses: actions/checkout@v7
      # The runner ships Ubuntu's default pg_dump (16.x), but the service container above
      # is Postgres 18. pg_dump refuses to dump a server newer than itself -- "aborting
      # because of server version mismatch" -- so tests/test_pg_dump_confidentiality.py
      # fails on tooling rather than on anything it is trying to prove. Install the
      # matching major from PGDG. Locally this never appears: Homebrew's postgresql@18
      # ships pg_dump 18 alongside the server, so client and server always agree.
      - name: Install the Postgres 18 client so pg_dump matches the service major
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      # The revision chain is empty at this point in the phase, so this is a no-op upgrade
      # that still proves the Alembic import path and the database connection -- exactly
      # what should be proven before any schema exists.
      - run: uv run alembic upgrade head
      - run: uv run pytest
