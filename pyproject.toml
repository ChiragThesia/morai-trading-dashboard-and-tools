[project]
name = "morai"
version = "0.1.0"
description = "Morai Journal — multi-user trading journal backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "sqlalchemy[postgresql-asyncpg]==2.0.52",
  "asyncpg==0.31.0",
  "alembic==1.19.1",
  "procrastinate==3.9.0",
  "hypercorn==0.18.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "basedpyright==1.39.10",
  "mypy==2.3.1",
  "ruff==0.16.5",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morai"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["tests/gate/fixtures"]
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
reportIgnoreCommentWithoutRule = "error"

[tool.mypy]
strict = true
disallow_any_explicit = true
plugins = []
exclude = ["tests/gate/fixtures"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
extend-exclude = ["tests/gate/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "PGH", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "D-06: Any is banned. Use a Pydantic model_validate() boundary or a justified `# noqa: <rule> # why: ...` suppression." }
"typing.cast" = { msg = "D-06: cast is banned. Resolve with a Pydantic model_validate() boundary instead." }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "db: test requires a live Postgres connection",
]
