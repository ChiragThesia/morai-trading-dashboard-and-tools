[project]
name = "morai"
version = "0.1.0"
description = "Morai Journal — multi-user trading journal backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "sqlalchemy[postgresql-asyncpg]==2.0.52",
  "asyncpg==0.31.0",
  "alembic==1.19.1",
  "procrastinate==3.9.0",
  "hypercorn==0.18.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.15.0",
  "posthog==7.44.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "basedpyright==1.39.10",
  "mypy==2.3.1",
  "ruff==0.16.5",
  "uvicorn==0.52.4",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morai"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["tests/gate/fixtures"]
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
reportIgnoreCommentWithoutRule = "error"

[tool.mypy]
strict = true
plugins = []
exclude = ["tests/gate/fixtures"]
# D-05 named `disallow_any_explicit` alongside `strict`. Measured this session (with
# and without `plugins = pydantic.mypy`): it false-positives on the class-declaration
# line of *any* pydantic.BaseModel/BaseSettings subclass — `class S(BaseModel): pass`
# alone fails with "Explicit Any is not allowed", because BaseModel's own dataclass-
# transform init signature carries `Any` and mypy attributes that to the subclass
# statement. Every model in this codebase derives from BaseModel or BaseSettings
# (D-01, D-09, D-15), so this would suppress on every model file for zero additional
# signal: basedpyright's `reportExplicitAny` (below) already bans Any written in our
# own code, correctly scoped — confirmed clean against this exact class. D-05's own
# division of labour already assigns Any-detection primarily to basedpyright; omitted
# here rather than carrying a suppression comment on every model class in the project.

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
extend-exclude = ["tests/gate/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "PGH", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "D-06: Any is banned. Use a Pydantic model_validate() boundary or a justified `# noqa: <rule> # why: ...` suppression." }
"typing.cast" = { msg = "D-06: cast is banned. Resolve with a Pydantic model_validate() boundary instead." }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped, not the default per-function loop: `morai.db.session.get_engine`
# is `lru_cache`d, matching production (one process, one event loop, one pool for
# its life). A fresh loop per test function would hand that cached asyncpg pool to
# a second loop on the next db-marked test and raise "attached to a different loop"
# -- measured this session, plan 01-03 Task 2.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
markers = [
  "db: test requires a live Postgres connection",
]
